<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat • EMAITHWORLD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffd6e8;
    }

    .header {
      background: #e75480;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 15px;
      background: #fff0f5;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    #messages {
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .message {
      background: #ffe0f0;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .message strong {
      color: #e75480;
    }

    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      margin-bottom: 10px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #e75480;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #d94370;
    }

    a {
      display: inline-block;
      margin-top: 15px;
      color: #e75480;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>💬 Chat with Faith</h1>
    <p>Stay connected 💖</p>
  </div>

  <div class="container">
    <div id="messages"></div>

    <textarea id="chatInput" placeholder="Type your message..."></textarea>
    <button onclick="sendMessage()">Send 💌</button>

    <a href="dashboard.html">← Back to Dashboard</a>
  </div>

  <script type="module">
    import { db } from './firebase.js';
    import { collection, addDoc, getDocs, query, orderBy, serverTimestamp, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const user = localStorage.getItem("emaithUser") || "Anonymous";
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('chatInput');

    const chatCol = collection(db, 'chatMessages');

    // Real-time listener for chat messages
    onSnapshot(query(chatCol, orderBy('createdAt', 'asc')), snapshot => {
      messagesEl.innerHTML = '';
      snapshot.forEach(doc => {
        const msg = doc.data();
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `<strong>${msg.author}:</strong> ${msg.message}`;
        messagesEl.appendChild(div);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight; // scroll to bottom
    });

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return alert("Please type a message 💌");

      await addDoc(chatCol, {
        author: user,
        message: text,
        createdAt: serverTimestamp()
      });

      inputEl.value = '';
    }
  </script>

</body>
</html>
