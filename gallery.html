<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Gallery • EMAITHWORLD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #fff0f6;
      color: #333;
    }

    header {
      background: #ff8fb1;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .upload-box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-family: inherit;
    }

    button {
      padding: 10px 16px;
      background: #ff8fb1;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #e75480;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .photo-card {
      background: white;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .photo-card img {
      width: 100%;
      border-radius: 10px;
    }

    .caption {
      font-size: 13px;
      margin-top: 6px;
      color: #555;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #e75480;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  🖼 Our Gallery
</header>

<div class="container">

  <div class="upload-box">
    <input type="file" id="photoInput" accept="image/*">
    <textarea id="captionInput" placeholder="Write a sweet caption..."></textarea>
    <button onclick="addPhoto()">Add to Gallery 💕</button>
  </div>

  <div class="gallery" id="gallery"></div>

  <a class="back" href="dashboard.html">← Back to Dashboard</a>
</div>

<script type="module">
  import { db } from "./firebase.js"; // make sure firebase.js is in the same folder
  import { collection, addDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const gallery = document.getElementById("gallery");
  const photoInput = document.getElementById("photoInput");
  const captionInput = document.getElementById("captionInput");

  const galleryCollection = collection(db, "emaith_gallery");

  // Add photo to Firestore
  async function addPhoto() {
    if (!photoInput.files[0]) return alert("Please select a photo");
    const caption = captionInput.value;

    const reader = new FileReader();
    reader.onload = async function(e) {
      const imageData = e.target.result;

      try {
        await addDoc(galleryCollection, { image: imageData, caption, timestamp: Date.now() });
        photoInput.value = "";
        captionInput.value = "";
        alert("Added to Gallery 💕");
      } catch (err) {
        console.error(err);
        alert("Error adding photo 😢");
      }
    };
    reader.readAsDataURL(photoInput.files[0]);
  }

  // Render gallery from Firestore
  function renderGallery(docs) {
    gallery.innerHTML = "";
    docs.forEach(doc => {
      const { image, caption } = doc.data();
      const div = document.createElement("div");
      div.className = "photo-card";
      div.innerHTML = `
        <img src="${image}">
        <div class="caption">${caption}</div>
      `;
      gallery.appendChild(div);
    });
  }

  // Listen for realtime updates
  onSnapshot(galleryCollection, snapshot => {
    renderGallery(snapshot.docs);
  });

  // Make addPhoto accessible globally
  window.addPhoto = addPhoto;
</script>


</body>
</html>
