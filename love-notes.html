<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Love Notes • EMAITHWORLD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Keep your design -->
  <link rel="stylesheet" href="love-note.css">

  <style>
    body {
      background: #ffd6e8; /* Pink background */
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #fff0f5;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid #ddd;
      margin-bottom: 10px;
    }
    button {
      background: #e75480;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #d94370;
    }
    .noteCard {
      background: #ffe0f0;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 8px;
    }
    h1, h2 {
      color: #e75480;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💌 Love Notes</h1>

    <textarea id="noteInput" placeholder="Write your message here..."></textarea>
    <button onclick="saveNote()">Save 💖</button>

    <h2>All Notes:</h2>
    <div id="notesList"></div>

    <a href="dashboard.html">Back to Dashboard</a>
  </div>

  <script type="module">
    import { db } from './firebase.js';
    import { collection, addDoc, getDocs, query, orderBy, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const notesCol = collection(db, 'loveNotes');
    const notesList = document.getElementById('notesList');
    const noteInput = document.getElementById('noteInput');

    async function saveNote() {
      const text = noteInput.value.trim();
      if (!text) return alert("Please type something 💌");

      const user = localStorage.getItem("emaithUser") || "Anonymous";

      await addDoc(notesCol, {
        author: user,
        message: text,
        createdAt: serverTimestamp()
      });

      noteInput.value = '';
      loadNotes();
    }

    async function loadNotes() {
      notesList.innerHTML = '';
      const q = query(notesCol, orderBy('createdAt', 'desc'));
      const snapshot = await getDocs(q);

      snapshot.forEach(doc => {
        const note = doc.data();
        const div = document.createElement('div');
        div.className = 'noteCard';
        div.innerHTML = `<strong>${note.author}:</strong> ${note.message}`;
        notesList.appendChild(div);
      });
    }

    loadNotes();
  </script>
</body>
</html>
